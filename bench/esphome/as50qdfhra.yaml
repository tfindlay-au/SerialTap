# ESPHome config used for the 2026-09-19 GEA3 discovery run.
# Board: Unexpected Maker TinyS3, powered from the appliance's 5 V pin (no USB),
# through a BSS138 level shifter. Wiring in docs/gea3.md.
# Wi-Fi credentials and the static IP live in secrets.yaml, not here.
esphome:
  name: as50qdfhra

esp32:
  board: um_tinys3
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # Keeps UART0 (GPIO43/44) free for the appliance bus.
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: !secret as50qdfhra_ip
    gateway: !secret as50qdfhra_gateway
    subnet: 255.255.255.0
    dns1: !secret dns1
    dns2: !secret dns2

api:
ota:
  platform: esphome

external_components:
  - source: github://mguaylam/esphome-gea
    components: [gea]

uart:
  id: uart_gea
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 230400
  rx_buffer_size: 1024

gea:
  id: gea_hub
  uart_id: uart_gea
  protocol: gea3
  src_address: 0xBF   # the address the appliance polls every 30 s
  dest_address: 0xC0  # the appliance's control board
  erd_lookup: true    # GE public ERD names in the discovery log

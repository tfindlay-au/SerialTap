# SerialTap - atopile project.
#
# This is the SOURCE OF TRUTH for connectivity and parts (SPDD 6).
# Everything under build/ and the generated .kicad_pcb netlist come from here.
#
# NOTE: atopile 0.15.x emits a .kicad_pcb and reports - it does NOT generate a
# KiCad schematic. See docs/SPDD.md 6 for what that changes.

requires-atopile: "0.15.9"

paths:
  src: ./
  layout: ../pcb

builds:
  serialtap-r1p0:
    entry: main.ato:SerialTap
